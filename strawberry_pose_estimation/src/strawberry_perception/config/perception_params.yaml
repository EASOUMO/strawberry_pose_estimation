strawberry_perception:
  ros__parameters:

    # ── YOLO weights ─────────────────────────────────────────────────────────
    # Replace with absolute paths to your trained .pt files.
    # Training details (Xie 2024, Table 1):
    #   YOLOv5s     : 2152 fruit images,  resolution 640, batch 40,
    #                 AP 98.0 %, precision 97.6 %, recall 93.7 %
    #   YOLOv5s-seg : 7251 stem images,   resolution 320, batch 60,
    #                 AP 93.4 %, precision 92.5 %, recall 86.6 %
    det_weights: "/home/ubuntu/base_ws/src/strawberry_pose_estimation/src/strawberry_perception/training/scripts/runs/detect/runs/detect/strawberry_yolov5s/weights/best.pt"
    seg_weights: "/home/ubuntu/base_ws/src/strawberry_pose_estimation/src/strawberry_perception/training/scripts/runs/segment/stem_yolov5s_seg-4/weights/best.pt"

    # ── Inference device ─────────────────────────────────────────────────────
    # "cpu"    – always works; ~100 ms per frame on a modern CPU
    # "cuda:0" – requires CUDA; matches paper's RTX 4090 setup
    device: "cpu"

    # ── TF frames ────────────────────────────────────────────────────────────
    # camera_frame: optical frame of the RealSense D435
    camera_frame: "camera_color_optical_frame"
    # robot_frame: the frame picking_pose/picking_markers/detection_image are
    # published in. Defaults to "world" (the robot's stable, non-moving base
    # frame -- identical to base_link in this URDF) now that the full robot
    # stack is the normal way this runs.
    #
    # Do NOT default this to camera_link: the camera is wrist-mounted, so
    # camera_link's orientation relative to world changes with every arm
    # movement -- it is not a fixed frame. Publishing picking points in it
    # means "Z" in the message means a different real-world direction at
    # every joint configuration, which looks exactly like a coordinate bug
    # (e.g. moving the target along the room's real vertical axis shows up
    # as a change in a different field of the message) even though the
    # underlying pixel->camera->TF2 math is unaffected either way.
    #
    # Only override to camera_link for visual-only inspection with no
    # robot_state_publisher running at all (world/base_link won't exist yet
    # in that case, so TF lookups to them would simply fail).
    robot_frame:  "world"

    # ── ROS topics ───────────────────────────────────────────────────────────
    # realsense2_camera's current ROS2 wrapper namespaces its own node under
    # "camera", so topics are published as /camera/camera/... (not /camera/...).
    color_topic:       "/camera/camera/color/image_raw"
    # aligned_depth_to_color: depth reprojected into the color camera's frame,
    # so color intrinsics (fx,fy,cx,cy) apply directly to depth pixels too.
    # Requires the camera launched with align_depth.enable:=true
    depth_topic:       "/camera/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/camera/color/camera_info"

    # ── Debug visualisation ──────────────────────────────────────────────────
    # Publishes an annotated image on /strawberry/detection_image.
    # Disable in production to save bandwidth.
    publish_debug: true
